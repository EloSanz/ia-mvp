name: Backend CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install dependencies
      working-directory: ./server
      run: npm install

    - name: Run tests
      working-directory: ./server
      run: npm test

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: backend-tests

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: testdb
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install dependencies
      working-directory: ./server
      run: npm install

    - name: Create test environment file
      working-directory: ./server
      run: |
        echo "NODE_ENV=test" > .env
        echo "DATABASE_URL=postgresql://postgres:testpassword@localhost:5432/testdb" >> .env
        echo "DIRECT_URL=postgresql://postgres:testpassword@localhost:5432/testdb" >> .env  
        echo "JWT_SECRET=test_jwt_secret_key_for_ci" >> .env
        echo "OPENAI_API_KEY=test_key" >> .env


    - name: Run database migrations
      working-directory: ./server
      run: npx prisma migrate deploy

    - name: Run integration tests
      working-directory: ./server
      run: npm run test:integration

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: integration-tests
    environment: hostinger
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'

    steps:
    - name: Verify SSH credentials exist
      run: |
        if [ -z "${{ secrets.SSH_HOST }}" ]; then echo "❌ SSH_HOST no está configurado"; exit 1; fi
        if [ -z "${{ secrets.SSH_PASSWORD }}" ]; then echo "❌ SSH_PASSWORD no está configurado"; exit 1; fi
        echo "✔ Credenciales SSH verificadas"
    
    - name: Deploy to server
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.SSH_HOST }}
        username: root
        password: ${{ secrets.SSH_PASSWORD }}
        port: 22
        timeout: 30s
        script: |
          echo "➡️ Actualizando proyecto en VPS..."
          cd /root/ia-mvp || exit 1
          git pull origin develop

          echo "➡️ Configurando PATH..."
          export PATH="$HOME/.local/bin:$HOME/.cargo/bin:$PATH"

          echo "➡️ Iniciando servicios Backend y Frontend con Screen..."
          chmod +x start_services_screen.sh
          ./start_services_screen.sh
          echo "✅ Servicios levantados con Screen"