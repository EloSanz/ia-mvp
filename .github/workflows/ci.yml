name: Backend CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    environment: hostinger
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'

    steps:
    - name: Verify SSH credentials exist
      run: |
        if [ -z "${{ secrets.SSH_HOST }}" ]; then echo "❌ SSH_HOST no está configurado"; exit 1; fi
        if [ -z "${{ secrets.SSH_PASSWORD }}" ]; then echo "❌ SSH_PASSWORD no está configurado"; exit 1; fi
        echo "✔ Credenciales SSH verificadas"
    
    - name: Deploy to server
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.SSH_HOST }}
        username: root
        password: ${{ secrets.SSH_PASSWORD }}
        port: 22
        timeout: 30s
        script: |
          echo "➡️ Actualizando proyecto en VPS..."
          cd /root/ia-mvp || exit 1
          git fetch origin develop && git reset --hard origin/develop
          git clean -fd

          echo "➡️ Configurando PATH..."
          export PATH="$HOME/.local/bin:$HOME/.cargo/bin:$PATH"

          echo "➡️ Aplicando migraciones y generando cliente Prisma..."
          cd /root/ia-mvp/server
          npx prisma migrate deploy
          npx prisma generate

          echo "➡️ Instalando dependencias del frontend..."
          cd /root/ia-mvp/web
          npm install

          echo "➡️ Verificando configuración de Nginx..."
          cd /root/ia-mvp
          if [ ! -f "/etc/nginx/sites-enabled/icards.fun.conf" ]; then
            echo "⚠️  Nginx no está configurado. Ejecuta manualmente:"
            echo "   cd /root/ia-mvp && chmod +x scripts/setup_nginx.sh && ./scripts/setup_nginx.sh"
          else
            echo "✅ Nginx ya está configurado"
            # Recargar Nginx para aplicar cambios
            nginx -t && systemctl reload nginx || echo "⚠️  Error al recargar Nginx"
          fi

          echo "➡️ Iniciando servicios Backend y Frontend con Screen..."
          chmod +x start_services_screen.sh
          ./start_services_screen.sh
          echo "✅ Servicios levantados con Screen"