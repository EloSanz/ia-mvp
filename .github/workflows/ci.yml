name: Backend CI

on:
  push:
    branches: [ main, develop ,test]
  pull_request:
    branches: [ main, develop,test ]

jobs:
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        # Cachear dependencias para ambos, frontend y backend
        cache: 'npm'
        cache-dependency-path: |
          server/package-lock.json
          web/package-lock.json

    - name: Install dependencies
      working-directory: ./server
      run: npm install

    - name: Run tests
      working-directory: ./server
      run: npm test

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: backend-tests

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: testdb
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: server/package-lock.json

    - name: Install dependencies
      working-directory: ./server
      run: npm install

    - name: Create test environment file
      working-directory: ./server
      run: |
        echo "NODE_ENV=test" > .env
        echo "DATABASE_URL=postgresql://postgres:testpassword@localhost:5432/testdb" >> .env
        echo "DIRECT_URL="" >> .env
        echo "JWT_SECRET=test_jwt_secret_key_for_ci" >> .env
        echo "OPENAI_API_KEY=test_key" >> .env

    - name: Run database migrations
      working-directory: ./server
      run: npx prisma migrate deploy

    - name: Run integration tests
      working-directory: ./server
      run: npm run test:integration

  deploy:
    name: Build & Deploy
    needs: integration-tests
    runs-on: ubuntu-latest # Asegúrate que las pruebas de integración pasen antes de desplegar
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/test')
    steps:
      - uses: actions/checkout@v4

      - name: Set environment vars
        env:
          TEST_AZURE_REGISTRY_LOGIN_SERVER: ${{ secrets.TEST_AZURE_REGISTRY_LOGIN_SERVER }}
          TEST_AZURE_REGISTRY_USERNAME: ${{ secrets.TEST_AZURE_REGISTRY_USERNAME }}
          TEST_AZURE_REGISTRY_PASSWORD: ${{ secrets.TEST_AZURE_REGISTRY_PASSWORD }}
          PROD_AZURE_REGISTRY_LOGIN_SERVER: ${{ secrets.PROD_AZURE_REGISTRY_LOGIN_SERVER }}
          PROD_AZURE_REGISTRY_USERNAME: ${{ secrets.PROD_AZURE_REGISTRY_USERNAME }}
          PROD_AZURE_REGISTRY_PASSWORD: ${{ secrets.PROD_AZURE_REGISTRY_PASSWORD }}
        run: |
          echo "IMAGE_TAG=${GITHUB_SHA::7}" >> $GITHUB_ENV
          if [[ "${GITHUB_REF##*/}" == "test" ]]; then
            echo "ENV=test" >> $GITHUB_ENV
            echo "AZURE_REGISTRY_LOGIN_SERVER=$TEST_AZURE_REGISTRY_LOGIN_SERVER" >> $GITHUB_ENV
            echo "AZURE_REGISTRY_USERNAME=$TEST_AZURE_REGISTRY_USERNAME" >> $GITHUB_ENV
            echo "AZURE_REGISTRY_PASSWORD=$TEST_AZURE_REGISTRY_PASSWORD" >> $GITHUB_ENV
          else
            echo "ENV=prod" >> $GITHUB_ENV
            echo "AZURE_REGISTRY_LOGIN_SERVER=$PROD_AZURE_REGISTRY_LOGIN_SERVER" >> $GITHUB_ENV
            echo "AZURE_REGISTRY_USERNAME=$PROD_AZURE_REGISTRY_USERNAME" >> $GITHUB_ENV
            echo "AZURE_REGISTRY_PASSWORD=$PROD_AZURE_REGISTRY_PASSWORD" >> $GITHUB_ENV
          fi

      - name: Log in to Azure Container Registry
        uses: azure/docker-login@v1
        with:
          login-server: ${{ env.AZURE_REGISTRY_LOGIN_SERVER }}
          username: ${{ env.AZURE_REGISTRY_USERNAME }}
          password: ${{ env.AZURE_REGISTRY_PASSWORD }}

      - name: Build Docker images
        # Usamos docker build para construir y etiquetar directamente, es más limpio en CI.
        # docker-compose build no siempre se comporta como se espera en estos entornos.
        run: |
          # El contexto de build debe ser la raíz (.) para que pueda encontrar la carpeta 'web'
          docker build -t ${{ env.AZURE_REGISTRY_LOGIN_SERVER }}/frontend:${{ env.IMAGE_TAG }} -f web/Dockerfile .
          # El contexto de build debe ser la raíz (.) para que pueda encontrar la carpeta 'server'
          docker build -t ${{ env.AZURE_REGISTRY_LOGIN_SERVER }}/backend:${{ env.IMAGE_TAG }} -f server/Dockerfile ./server

      - name: Push Docker images to Azure
        run: |
          docker push ${{ env.AZURE_REGISTRY_LOGIN_SERVER }}/frontend:${{ env.IMAGE_TAG }}
          docker push ${{ env.AZURE_REGISTRY_LOGIN_SERVER }}/backend:${{ env.IMAGE_TAG }}

      - name: (Optional) Push 'latest' tag
        run: |
          docker tag ${{ env.AZURE_REGISTRY_LOGIN_SERVER }}/frontend:${{ env.IMAGE_TAG }} ${{ env.AZURE_REGISTRY_LOGIN_SERVER }}/frontend:latest
          docker tag ${{ env.AZURE_REGISTRY_LOGIN_SERVER }}/backend:${{ env.IMAGE_TAG }} ${{ env.AZURE_REGISTRY_LOGIN_SERVER }}/backend:latest
          docker push ${{ env.AZURE_REGISTRY_LOGIN_SERVER }}/frontend:latest
          docker push ${{ env.AZURE_REGISTRY_LOGIN_SERVER }}/backend:latest

      - name: Logout from Azure Container Registry
        run: docker logout ${{ env.AZURE_REGISTRY_LOGIN_SERVER }}    