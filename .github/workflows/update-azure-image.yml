name: Update Azure Image

on:
  push:
    branches:
      - main
      - azure
      - test

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    needs: [integration-tests]   # ✅ el job final del CI

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
# Este bloque configura las variables de entorno según el entorno (test o prod).
# No es código ejecutable, solo define lógica condicional para el workflow.
      - name: Set environment variables
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/test" ]]; then
            echo "ENV=test" >> $GITHUB_ENV
            echo "IMAGE_TAG=v1" >> $GITHUB_ENV
            echo "AZURE_REGISTRY_LOGIN_SERVER=${{ secrets.TEST_AZURE_REGISTRY_LOGIN_SERVER }}" >> $GITHUB_ENV
            echo "AZURE_REGISTRY_USERNAME=${{ secrets.TEST_AZURE_REGISTRY_USERNAME }}" >> $GITHUB_ENV
            echo "AZURE_REGISTRY_PASSWORD=${{ secrets.TEST_AZURE_REGISTRY_PASSWORD }}" >> $GITHUB_ENV
          else
            echo "ENV=prod" >> $GITHUB_ENV
            echo "IMAGE_TAG=latest" >> $GITHUB_ENV
            echo "AZURE_REGISTRY_LOGIN_SERVER=${{ secrets.PROD_AZURE_REGISTRY_LOGIN_SERVER }}" >> $GITHUB_ENV
            echo "AZURE_REGISTRY_USERNAME=${{ secrets.PROD_AZURE_REGISTRY_USERNAME }}" >> $GITHUB_ENV
            echo "AZURE_REGISTRY_PASSWORD=${{ secrets.PROD_AZURE_REGISTRY_PASSWORD }}" >> $GITHUB_ENV

      - name: Log in to Azure Container Registry
        uses: azure/docker-login@v1
        with:
          login-server: ${{ env.AZURE_REGISTRY_LOGIN_SERVER }}
          username: ${{ env.AZURE_REGISTRY_USERNAME }}
          password: ${{ env.AZURE_REGISTRY_PASSWORD }}

      - name: Build Docker images
        run: |
          docker compose -f docker-compose.yml build
# Build frontend image and backend image (ia-mvp-frontend:latest and ia-mvp-backend:latest)
      - name: Tag Docker images
        run: |
          docker tag ia-mvp-frontend:latest ${{ env.AZURE_REGISTRY_LOGIN_SERVER}}/frontend:${{ env.IMAGE_TAG }}
          docker tag ia-mvp-backend:latest ${{ env.AZURE_REGISTRY_LOGIN_SERVER }}/backend:${{ env.IMAGE_TAG }}

      - name: Push Docker images to Azure
        run: |
          docker push ${{ env.AZURE_REGISTRY_LOGIN_SERVER }}/frontend:${{ env.IMAGE_TAG }}
          docker push ${{ env.AZURE_REGISTRY_LOGIN_SERVER }}/backend:${{ env.IMAGE_TAG }}

      - name: Logout from Azure Container Registry
        run: |
          docker logout ${{ env.AZURE_REGISTRY_LOGIN_SERVER }}
