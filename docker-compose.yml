  backend:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: ia-flashcards-api
    env_file:
      - ./server/.env
    environment:
      - PORT=3000
    volumes:
      - ./server:/usr/src/app
    ports:
      - "3000:3000"
    command: sh -c "npm run dockerStart"

  frontend:
    build:
      context: .
      dockerfile: web/Dockerfile
    container_name: ia-flashcards-web
    env_file:
      - ./web/.env
    # Esta variable ahora es para Nginx en tiempo de ejecución, no para Vite en tiempo de construcción.
    # Apunta al servicio 'backend' en el puerto 3000 dentro de la red de Docker.
    environment:
      - VITE_API_URL=http://backend:3000
    volumes:
      - ./web:/usr/src/app
    ports:
      - "5173:5173"
    depends_on:
      - backend

